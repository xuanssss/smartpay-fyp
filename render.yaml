databases:
  - name: smartpay-db
    plan: free
    databaseName: smartpay
    user: smartpay

services:
  - type: web
    name: smartpay
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn smartpay.wsgi:application --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartpay-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.13.5
